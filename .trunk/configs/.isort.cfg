[settings]
profile=black
# isort is not currently enabled in .trunk/trunk.yaml. This file records the
# settings it needs so it can be turned on later. Enabling it today would
# reformat the import blocks of ~40 existing files: the adapter checkout
# ships only part of the medre package tree, so isort's src-path detection
# cannot classify medre.core/medre.interop as first-party on its own, and
# the existing style (third-party, medre, and the medre_*_tests helper
# package in one contiguous group, helper first) matches no isort section
# layout. Adapter CI does not run isort, so nothing else enforces it.
known_first_party=medre
no_lines_before=FIRSTPARTY
