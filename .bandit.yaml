# Scan production sources for dangerous subprocess calls and hard-coded secrets.
# Test fixtures use literal credentials and temporary files; keep the test-only
# exceptions out of the production scan instead of globally skipping them.
exclude_dirs:
  - tests
skips:
  - B101  # assert is used for defensive internal invariants
  - B110  # intentional best-effort cleanup at reviewed call sites
  - B112  # intentional best-effort iteration at reviewed call sites
  - B311  # non-cryptographic random usage
